name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.4.10 flake8==7.1.0 mypy==1.10.0

      - name: Install project dependencies (if any)
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ruff (fast lint)
        run: |
          ruff check .

      - name: Flake8 (PEP8 style)
        run: |
          flake8 .

      - name: Mypy (type checking)
        run: |
          mypy --install-types --non-interactive .
